<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generate Thumbnails — 3D Print Library</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      padding: 2rem;
      min-height: 100vh;
    }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
    .subtitle { color: #888; margin-bottom: 2rem; }
    .stats {
      display: flex; gap: 2rem; margin-bottom: 2rem;
      flex-wrap: wrap;
    }
    .stat {
      background: #16213e;
      border-radius: 8px;
      padding: 1rem 1.5rem;
      min-width: 140px;
    }
    .stat__value { font-size: 2rem; font-weight: 700; color: #4fc3f7; }
    .stat__label { font-size: 0.8rem; color: #888; margin-top: 0.25rem; }
    .progress-bar {
      width: 100%; height: 8px;
      background: #16213e; border-radius: 4px;
      margin-bottom: 1rem; overflow: hidden;
    }
    .progress-bar__fill {
      height: 100%; background: #4fc3f7;
      border-radius: 4px; transition: width 0.3s;
      width: 0%;
    }
    .status { margin-bottom: 1.5rem; font-size: 0.9rem; }
    .status--running { color: #4fc3f7; }
    .status--done { color: #66bb6a; }
    .status--error { color: #ef5350; }
    .controls { margin-bottom: 2rem; }
    button {
      background: #4fc3f7; color: #1a1a2e; border: none;
      padding: 0.6rem 1.5rem; border-radius: 6px;
      font-size: 0.9rem; font-weight: 600; cursor: pointer;
    }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button:hover:not(:disabled) { background: #81d4fa; }
    .log {
      background: #0f0f1a; border-radius: 8px;
      padding: 1rem; max-height: 400px; overflow-y: auto;
      font-family: "SF Mono", "Fira Code", monospace;
      font-size: 0.75rem; line-height: 1.6;
    }
    .log__entry { padding: 2px 0; }
    .log__entry--ok { color: #66bb6a; }
    .log__entry--fail { color: #ef5350; }
    .log__entry--skip { color: #888; }
    .back-link { margin-top: 2rem; display: inline-block; color: #4fc3f7; text-decoration: none; }
    .back-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <h1>Batch Thumbnail Generation</h1>
  <p class="subtitle">Renders all pending STL/3MF/OBJ files via Three.js in your browser's GPU.</p>

  <div class="stats">
    <div class="stat">
      <div class="stat__value" id="stat-total">—</div>
      <div class="stat__label">Total Renderable</div>
    </div>
    <div class="stat">
      <div class="stat__value" id="stat-done">—</div>
      <div class="stat__label">Already Cached</div>
    </div>
    <div class="stat">
      <div class="stat__value" id="stat-pending">—</div>
      <div class="stat__label">Pending</div>
    </div>
    <div class="stat">
      <div class="stat__value" id="stat-rendered">0</div>
      <div class="stat__label">Rendered This Run</div>
    </div>
    <div class="stat">
      <div class="stat__value" id="stat-failed">0</div>
      <div class="stat__label">Failed</div>
    </div>
  </div>

  <div class="progress-bar">
    <div class="progress-bar__fill" id="progress-fill"></div>
  </div>
  <div class="status" id="status">Ready to start.</div>

  <div class="controls">
    <button id="start-btn">Start Generation</button>
    <button id="stop-btn" disabled>Stop</button>
  </div>

  <div class="log" id="log"></div>

  <a class="back-link" href="/">← Back to Library</a>

  <!-- Three.js -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/loaders/STLLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/loaders/OBJLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/loaders/3MFLoader.js"></script>

  <script>
    /**
     * Batch thumbnail generator.
     * Fetches pending files from API, renders each via Three.js, POSTs result.
     */

    const logger = {
      error: (msg, data) => console.error(msg, data),
      warn: (msg, data) => console.warn(msg, data),
      info: (msg, data) => console.info(msg, data),
      debug: (msg, data) => console.debug(msg, data)
    };

    const MAX_CONCURRENT = 3;
    let running = false;
    let stopRequested = false;
    let rendered = 0;
    let failed = 0;
    let pendingFiles = [];

    const $ = (id) => document.getElementById(id);

    function logEntry(msg, type = 'ok') {
      const el = document.createElement('div');
      el.className = `log__entry log__entry--${type}`;
      el.textContent = msg;
      $('log').prepend(el);
    }

    function updateProgress() {
      const total = pendingFiles.length;
      const done = rendered + failed;
      const pct = total > 0 ? Math.round((done / total) * 100) : 0;
      $('progress-fill').style.width = pct + '%';
      $('stat-rendered').textContent = rendered;
      $('stat-failed').textContent = failed;
    }

    async function loadPending() {
      const resp = await fetch('/api/files/pending-thumbnails');
      const data = await resp.json();
      $('stat-total').textContent = data.total_renderable;
      $('stat-done').textContent = data.already_done;
      $('stat-pending').textContent = data.pending;
      pendingFiles = data.files;
      return data;
    }

    async function renderFile(file) {
      const resp = await fetch(`/api/files/${file.id}/raw`);
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const buffer = await resp.arrayBuffer();

      let object;
      if (file.format === 'stl') {
        const loader = new THREE.STLLoader();
        const geometry = loader.parse(buffer);
        const material = new THREE.MeshPhongMaterial({
          color: 0x808080, specular: 0x111111, shininess: 50
        });
        object = new THREE.Mesh(geometry, material);
      } else if (file.format === 'obj') {
        const loader = new THREE.OBJLoader();
        const text = new TextDecoder().decode(buffer);
        object = loader.parse(text);
      } else if (file.format === '3mf') {
        const loader = new THREE.ThreeMFLoader();
        object = loader.parse(buffer);
      }

      if (!object) throw new Error('No geometry loaded');

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0xe8e8e8);
      scene.add(new THREE.AmbientLight(0xffffff, 0.6));
      const dir1 = new THREE.DirectionalLight(0xffffff, 0.8);
      dir1.position.set(1, 2, 3);
      scene.add(dir1);
      const dir2 = new THREE.DirectionalLight(0xffffff, 0.4);
      dir2.position.set(-1, -1, -2);
      scene.add(dir2);
      scene.add(object);

      const box = new THREE.Box3().setFromObject(object);
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z);
      const distance = maxDim * 1.8;

      const camera = new THREE.PerspectiveCamera(45, 1, 0.1, distance * 10);
      camera.position.set(
        center.x + distance * 0.5,
        center.y + distance * 0.5,
        center.z + distance
      );
      camera.lookAt(center);

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
      renderer.setSize(256, 256);
      renderer.render(scene, camera);

      const dataUrl = renderer.domElement.toDataURL('image/png');
      renderer.dispose();

      // Upload
      const uploadResp = await fetch('/api/thumbnails', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ file_id: file.id, image: dataUrl })
      });
      if (!uploadResp.ok) throw new Error('Upload failed');
    }

    async function processFile(file) {
      try {
        await renderFile(file);
        rendered++;
        logEntry(`OK: ${file.filename} (${file.format})`, 'ok');
      } catch (e) {
        failed++;
        logEntry(`FAIL: ${file.filename} — ${e.message}`, 'fail');
        // Mark as failed
        await fetch('/api/thumbnails', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ file_id: file.id, image: '__failed__' })
        }).catch(() => {});
      }
      updateProgress();
    }

    async function runBatch() {
      running = true;
      stopRequested = false;
      $('start-btn').disabled = true;
      $('stop-btn').disabled = false;
      $('status').textContent = 'Rendering...';
      $('status').className = 'status status--running';

      let idx = 0;

      async function worker() {
        while (idx < pendingFiles.length && !stopRequested) {
          const file = pendingFiles[idx++];
          if (!file) break;
          $('status').textContent = `Rendering ${idx}/${pendingFiles.length}: ${file.filename}`;
          await processFile(file);
        }
      }

      // Run N workers in parallel
      const workers = [];
      for (let i = 0; i < MAX_CONCURRENT; i++) {
        workers.push(worker());
      }
      await Promise.all(workers);

      running = false;
      $('start-btn').disabled = false;
      $('stop-btn').disabled = true;

      if (stopRequested) {
        $('status').textContent = `Stopped. Rendered: ${rendered}, Failed: ${failed}, Remaining: ${pendingFiles.length - rendered - failed}`;
        $('status').className = 'status status--error';
      } else {
        $('status').textContent = `Done! Rendered: ${rendered}, Failed: ${failed}`;
        $('status').className = 'status status--done';
      }
    }

    // Event listeners
    $('start-btn').addEventListener('click', async () => {
      rendered = 0;
      failed = 0;
      $('log').innerHTML = '';
      await loadPending();
      if (pendingFiles.length === 0) {
        $('status').textContent = 'Nothing to render — all thumbnails are cached!';
        $('status').className = 'status status--done';
        return;
      }
      updateProgress();
      runBatch();
    });

    $('stop-btn').addEventListener('click', () => {
      stopRequested = true;
      $('stop-btn').disabled = true;
      $('status').textContent = 'Stopping after current renders finish...';
    });

    // Load stats on page load
    loadPending();
  </script>
</body>
</html>
